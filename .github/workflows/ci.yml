name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  integrity:
    name: result hashes verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recorded results were not edited after the run
        run: python experiment_verify.py RESULTS/experiment.json RESULTS/experiment_C003.json

  headline:
    name: headline claims reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Calibration gate must pass, F-B must hold in both regions
        run: |
          python - <<'PY'
          from battery import calibrate_known_answers
          from perturbation import compare_regions

          cal = calibrate_known_answers()
          assert cal.passed, cal.failures
          print("calibration PASS")

          r = compare_regions(seed=0)
          assert r["verdict_detail"]["load_claim_FB_holds_both"], r["gates"]
          print("F-B holds:", r["gates"]["F-B adversarial < human"])
          print(r["verdict"])
          PY

  lint:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install flake8
      - name: Run flake8
        run: flake8 . --max-line-length=120 --extend-exclude=.venv,build,dist,__pycache__